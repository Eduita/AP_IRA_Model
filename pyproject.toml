# Workspace root — covers legacy scripts and the refactor library.
#
# Run `uv sync` from this directory to get an environment that can execute
# everything: legacy simulation runners, the refactor pipeline, and the
# Dagster UI.
#
# Layout:
#   legacy/      Plain Python scripts (deps declared here)
#   refactor/    Installable library + Dagster pipeline (own pyproject.toml)
#   data/        Shared input datasets

[project]
name = "ap-ira-workspace"
version = "0.1.0"
description = "Workspace root for the AP IRA ammonia production model"
requires-python = ">=3.11"

# ── Dependencies ─────────────────────────────────────────────────────────────
# Full union of all legacy/ and refactor/ runtime requirements.
# The refactor/ member's own pyproject.toml is also resolved into this
# lockfile, so these versions act as the floor for the whole workspace.

dependencies = [
    # Numerics
    "numpy>=1.26",
    "scipy>=1.13",

    # Data wrangling
    "pandas>=2.2",
    "openpyxl>=3.1",       # Excel I/O (pandas engine)

    # Optimisation (legacy LP solver)
    "pulp>=2.8",

    # Visualisation
    "matplotlib>=3.9",
    "seaborn>=0.13",

    # HTTP (Renewables.ninja API calls)
    "requests>=2.32",

    # Config & utilities
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",           # Progress bars in legacy runners

    # Dagster orchestration layer
    "dagster>=1.9",
    "dagster-webserver>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No installable Python packages at the workspace root.
# ap_ira_lib and ap_ira_dagster are provided by the refactor/ member.
only-include = []

# ── uv workspace ─────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["refactor"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["refactor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N999",   # module name (legacy files use _ prefix by convention)
]

[tool.ruff.lint.per-file-ignores]
"legacy/**" = ["E", "W", "F", "N", "UP"]   # legacy code: lint-free zone

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["refactor"]
addopts   = "-v --tb=short"
