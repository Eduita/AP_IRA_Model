name: CI

on:
  push:
    branches: [master, "refactor/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --only-group dev

      - name: ruff check
        run: uv run ruff check refactor/ap_ira_lib refactor/ap_ira_dagster

      - name: ruff format --check
        run: uv run ruff format --check refactor/ap_ira_lib refactor/ap_ira_dagster

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install all workspace dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: uv run pytest refactor --tb=short
        env:
          # Provide stub tokens so dotenv-loaded scripts don't KeyError in tests
          NINJA_WPI_TOKEN: stub
          NINJA_CU_TOKEN: stub
          NINJA_MY_TOKEN: stub

  dagster-check:
    name: Validate Dagster definitions
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Verify Dagster Definitions load
        working-directory: refactor
        run: |
          uv run python - <<'EOF'
          from ap_ira_dagster import defs
          graph = defs.resolve_asset_graph()
          keys = sorted(k.to_user_string() for k in graph.get_all_asset_keys())
          jobs = [j.name for j in defs.jobs]
          print("Assets:", keys)
          print("Jobs:", jobs)
          assert "simulation_results" in keys
          assert "merged_results" in keys
          assert "excel_output" in keys
          assert "simulation_job" in jobs
          assert "aggregation_job" in jobs
          print("OK")
          EOF
