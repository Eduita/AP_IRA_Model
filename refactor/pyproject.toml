[project]
name = "ap-ira-model"
version = "1.0.0"
description = "Stochastic financial analysis of ammonia production technologies under U.S. IRA tax credits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scipy>=1.13",
    "pulp>=2.8",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "requests>=2.32",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
run-model = "scripts.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ap_ira_lib"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
